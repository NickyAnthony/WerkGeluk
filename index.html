<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WerkGeluk Recruitment — Boutique recruitment voor commerciële en technische sales</title>
  <meta name="description" content="WerkGeluk Recruitment helpt organisaties bij het vinden van commerciële en technische sales professionals. Persoonlijk. Selectief. Gericht op duurzame matches." />
  <link rel="icon" href="data:," />
  <style>
/* =========================================================
   Foundations — Colors + Type tokens
   ========================================================= */
@font-face {
  font-family: 'Arimo';
  src: url('fonts/Arimo-VariableFont_wght.ttf') format('truetype-variations');
  font-weight: 400 700;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Arimo';
  src: url('fonts/Arimo-Italic-VariableFont_wght.ttf') format('truetype-variations');
  font-weight: 400 700;
  font-style: italic;
  font-display: swap;
}
:root {
  --wg-navy-900: #09152C;
  --wg-navy-800: #0F1F3D;
  --wg-navy-700: #132541;
  --wg-navy-600: #1B2E50;
  --wg-navy-500: #2D4068;
  --wg-navy-400: #4F6088;
  --wg-navy-050: #F3F5FA;
  --wg-gold-700: #8B6A2E;
  --wg-gold-600: #A98545;
  --wg-gold-500: #C9A25B;
  --wg-gold-400: #DCBB7B;
  --wg-gold-300: #E8CC8E;
  --wg-gold-200: #F0D89A;
  --wg-gold-100: #F7E7BE;
  --wg-paper: #FAF8F4;
  --wg-cream: #F5F7FA;
  --wg-white: #FFFFFF;
  --wg-ink-900: #0F1F3D;
  --wg-ink-700: #2C3D5E;
  --wg-ink-500: #5C6A85;
  --wg-ink-300: #98A2B6;
  --wg-line: #E5E7EC;
  --wg-line-strong: #C9CFDB;
  --fg-1: var(--wg-ink-900);
  --fg-2: var(--wg-ink-700);
  --fg-3: var(--wg-ink-500);
  --gold-accent: var(--wg-gold-700);
  --gold-soft: var(--wg-gold-100);
  --sh-2: 0 2px 8px rgba(14,27,51,0.06), 0 1px 2px rgba(14,27,51,0.04);
  --sh-3: 0 8px 24px rgba(14,27,51,0.08), 0 2px 4px rgba(14,27,51,0.04);
  --sh-gold: 0 6px 20px rgba(176,131,38,0.22);
  --r-md: 8px;
  --r-lg: 14px;
  --r-xl: 22px;
  --r-pill: 999px;
  --font-sans: 'Arimo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-serif: 'Arimo', Georgia, serif;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}

/* =========================================================
   Reset + Base
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; padding: 0; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal { transition: none !important; opacity: 1 !important; transform: none !important; }
  .btn, .arrow, .nav__links a::after, .about__portrait-photo,
  .logo-cell img, .locatie__link, .cta__card-value { transition: none !important; }
}
:focus-visible {
  outline: 2px solid var(--wg-gold-500);
  outline-offset: 3px;
  border-radius: 3px;
}
body {
  font-family: var(--font-sans);
  background: var(--wg-navy-900);
  color: var(--wg-paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

/* =========================================================
   Layout
   ========================================================= */
.container { max-width: 1200px; margin: 0 auto; padding: 0 40px; }

/* =========================================================
   Utilities
   ========================================================= */
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold-accent);
}
.eyebrow::before {
  content: "";
  width: 22px; height: 1px;
  background: currentColor;
  display: inline-block;
  opacity: 0.7;
}

.reveal {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 720ms var(--ease-out), transform 720ms var(--ease-out);
}
.reveal.is-in { opacity: 1; transform: none; }

/* =========================================================
   Buttons
   ========================================================= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px 28px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.005em;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 240ms var(--ease-out);
  white-space: nowrap;
  background: none;
  color: inherit;
  font-family: inherit;
}
.btn:active { transform: translateY(1px) scale(0.99); }
.btn--gold { background: var(--wg-gold-500); color: var(--wg-navy-900); }
.btn--gold:hover { background: var(--wg-gold-400); box-shadow: var(--sh-gold); transform: translateY(-1px); }
.btn--sm { padding: 10px 18px; font-size: 13px; border-radius: 8px; }
.arrow { display: inline-block; transition: transform 240ms var(--ease-out); }
.btn:hover .arrow { transform: translateX(3px); }

/* =========================================================
   Nav
   ========================================================= */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  width: 100%;
  z-index: 30;
  background: rgba(9,21,44,0.72);
  border-bottom: 1px solid rgba(250,248,244,0.06);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.nav__inner {
  display: flex;
  align-items: center;
  gap: 36px;
  padding: 4px 40px;
  max-width: 1320px;
  margin: 0 auto;
}
.nav__logo img { width: 280px; height: auto; display: block; }
.nav__links { display: flex; gap: 32px; flex: 1; margin-left: 24px; }
.nav__links a {
  font-size: 14px;
  font-weight: 500;
  color: rgba(250,248,244,0.78);
  position: relative;
  padding: 4px 0;
  transition: color 200ms ease;
}
.nav__links a::after {
  content: "";
  position: absolute;
  left: 0; right: 100%;
  bottom: -4px;
  height: 1px;
  background: var(--wg-gold-400);
  transition: right 280ms var(--ease-out);
}
.nav__links a:hover,
.nav__links a.is-active { color: var(--wg-paper); }
.nav__links a:hover::after,
.nav__links a.is-active::after { right: 0; }
.nav__cta { margin-left: auto; }

/* Hamburger */
.nav__hamburger {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  margin-left: auto;
  color: rgba(250,248,244,0.9);
  flex-direction: column;
  gap: 5px;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 31;
}
.nav__hamburger span {
  display: block;
  width: 22px;
  height: 1.5px;
  background: currentColor;
  border-radius: 2px;
  transition: transform 300ms var(--ease-out), opacity 200ms ease, transform 300ms var(--ease-out);
}
.nav__hamburger.is-open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.nav__hamburger.is-open span:nth-child(2) { opacity: 0; }
.nav__hamburger.is-open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

/* Mobile menu overlay */
.nav__mobile {
  position: fixed;
  inset: 0;
  background: var(--wg-navy-900);
  z-index: 29;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 280ms ease;
}
.nav__mobile.is-open { opacity: 1; pointer-events: all; }
.nav__mobile a {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: rgba(250,248,244,0.88);
  padding: 12px 28px;
  transition: color 200ms ease;
  text-align: center;
}
.nav__mobile a:hover { color: var(--wg-gold-300); }
.nav__mobile-cta {
  margin-top: 20px;
  padding: 14px 36px !important;
  background: var(--wg-gold-500) !important;
  color: var(--wg-navy-900) !important;
  border-radius: 10px;
  font-family: var(--font-sans) !important;
  font-size: 15px !important;
  font-weight: 600 !important;
  letter-spacing: 0 !important;
}

/* =========================================================
   Hero — Cinematic Navy
   ========================================================= */
.hero {
  position: relative;
  background: var(--wg-navy-900);
  background-image:
    radial-gradient(rgba(250,248,244,0.045) 1px, transparent 1px);
  background-size: 38px 38px;
  color: var(--wg-paper);
  padding: 160px 0 120px;
  overflow: hidden;
  isolation: isolate;
}
.hero::before {
  content: "";
  position: absolute;
  top: -160px; right: -180px;
  width: 920px; height: 920px;
  background: radial-gradient(circle at center,
    rgba(201,162,91,0.34) 0%,
    rgba(201,162,91,0.14) 30%,
    transparent 60%);
  pointer-events: none;
}
.hero::after {
  content: "";
  position: absolute;
  bottom: -260px; left: -180px;
  width: 640px; height: 640px;
  background: radial-gradient(circle at center, rgba(45,64,104,0.6) 0%, transparent 60%);
  pointer-events: none;
}
.hero__inner { position: relative; z-index: 1; padding-top: 8px; }
.hero__headline {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: clamp(48px, 7vw, 96px);
  line-height: 1.02;
  letter-spacing: -0.025em;
  margin: 28px 0 36px;
  max-width: 18ch;
  color: var(--wg-paper);
  text-wrap: balance;
}
.hero__headline em {
  font-style: italic;
  color: var(--wg-gold-300);
  font-weight: 500;
  display: inline-block;
  position: relative;
}
.hero__headline em::after {
  content: "";
  position: absolute;
  left: -2px; right: -2px; bottom: 0.06em;
  height: 1px;
  background: var(--wg-gold-400);
  opacity: 0.4;
}
.hero__sub {
  font-size: 19px;
  line-height: 1.6;
  color: rgba(250,248,244,0.78);
  max-width: 720px;
  margin: 0;
}
.hero__tagline {
  font-size: 19px;
  line-height: 1.6;
  color: rgba(250,248,244,0.78);
  max-width: 720px;
  margin: 12px 0 0;
  font-style: italic;
  opacity: 0.86;
}
.hero__ctas { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 44px; }
.hero__meta {
  display: flex;
  gap: 48px;
  margin-top: 64px;
  padding-top: 40px;
  border-top: 1px solid rgba(250,248,244,0.14);
}
.hero__meta-item { display: flex; flex-direction: column; gap: 4px; }
.hero__meta-value {
  font-family: var(--font-serif);
  font-size: clamp(28px, 3.5vw, 40px);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--wg-gold-300);
  line-height: 1;
}
.hero__meta-label {
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(250,248,244,0.56);
  font-weight: 500;
}

/* =========================================================
   Section scaffold
   ========================================================= */
.section { padding: 120px 0; }
.section--tight { padding: 88px 0; }
.section--paper { background: var(--wg-paper); color: var(--wg-ink-900); }
.section--cream { background: var(--wg-cream); color: var(--wg-ink-900); }
.section--navy-deep { background: var(--wg-navy-900); color: var(--wg-paper); }

.section__head {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 80px;
  margin-bottom: 72px;
  align-items: end;
}
.section__title {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: clamp(36px, 4.4vw, 56px);
  line-height: 1.05;
  letter-spacing: -0.025em;
  margin: 18px 0 0;
  color: inherit;
  text-wrap: balance;
}
.section__title em { font-style: italic; font-weight: 500; color: var(--gold-accent); }
.section--navy-deep .section__title em { color: var(--wg-gold-300); }
.section__lede {
  font-size: 18px;
  line-height: 1.6;
  margin: 0;
  max-width: 540px;
  color: var(--fg-2);
}
.section--navy-deep .section__lede { color: rgba(250,248,244,0.72); }

/* =========================================================
   About
   ========================================================= */
.about {
  display: grid;
  grid-template-columns: 1fr 1.05fr;
  gap: 88px;
  align-items: stretch;
}
.about__portrait {
  position: relative;
  aspect-ratio: 4 / 5;
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--wg-navy-800);
  box-shadow: var(--sh-3);
}
.about__portrait-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 28%;
  z-index: 1;
  transition: transform 800ms var(--ease-out);
}
.about__portrait:hover .about__portrait-photo { transform: scale(1.02); }
.about__portrait-overlay {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 96px 28px 24px;
  z-index: 2;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  color: var(--wg-paper);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 500;
  background: linear-gradient(to top, rgba(9,21,44,0.78) 0%, rgba(9,21,44,0.0) 100%);
}
.about__portrait-overlay::before {
  content: "Nicky Roggeveen";
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 500;
  font-size: 22px;
  letter-spacing: -0.01em;
  text-transform: none;
}
.about__copy { display: flex; flex-direction: column; justify-content: center; gap: 20px; }
.about__copy h2 {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: clamp(28px, 3.4vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin: 8px 0 0;
  text-wrap: balance;
  color: var(--fg-1);
}
.about__copy h2 em { font-style: italic; color: var(--gold-accent); font-weight: 500; }
.about__copy p { font-size: 17px; line-height: 1.7; color: var(--fg-2); margin: 0; }
.about__signature {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 16px;
  padding-top: 24px;
  border-top: 1px solid var(--wg-line);
}
.about__signature-name {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 500;
  font-size: 22px;
  color: var(--gold-accent);
}
.about__signature-role { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); }

/* =========================================================
   Expertise
   ========================================================= */
.v3-expertise { display: flex; flex-direction: column; gap: 16px; }

.v3-expertise__rolelabel {
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(250,248,244,0.62);
  margin-bottom: 18px;
}
.v3-rolegrid {
  list-style: none;
  margin: 0 0 40px;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  border-top: 1px solid rgba(250,248,244,0.16);
}
.v3-rolegrid li {
  font-size: 17px;
  line-height: 1.4;
  padding: 18px 20px 18px 0;
  border-bottom: 1px solid rgba(250,248,244,0.16);
  color: var(--wg-paper);
  display: flex;
  align-items: center;
  gap: 14px;
}
.v3-rolegrid__dot {
  width: 8px; height: 8px;
  border-radius: 999px;
  background: var(--wg-gold-400);
  flex: none;
}

/* =========================================================
   Waarom (5 steps)
   ========================================================= */
.steps-5 {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0;
  position: relative;
}
.steps-5::before {
  display: none;
  content: "";
  position: absolute;
  top: 88px;
  left: 8%; right: 8%;
  height: 1px;
  background: var(--wg-line);
}
.step { padding: 0 28px; }
.step__dot {
  width: 16px; height: 16px;
  border-radius: 999px;
  background: var(--gold-accent);
  margin-bottom: 36px;
  position: relative;
  z-index: 2;
}
.step__dot::before {
  content: "";
  position: absolute;
  inset: -6px;
  border: 1px solid var(--gold-accent);
  border-radius: 999px;
  opacity: 0.4;
}
.step__num {
  font-family: var(--font-serif);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--gold-accent);
  opacity: 0.8;
  margin-bottom: 14px;
  display: block;
  text-transform: uppercase;
}
.step__title {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: 22px;
  line-height: 1.2;
  letter-spacing: -0.01em;
  margin: 0 0 12px;
  color: inherit;
}
.step__body { font-size: 14px; line-height: 1.65; color: var(--fg-2); margin: 0; }

/* =========================================================
   Trust bar + Logos
   ========================================================= */
.trustbar-title {
  font-size: 22px;
  line-height: 1.35;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--fg-1);
  margin: 0 0 40px;
  text-align: center;
}
.logos-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 0;
  border-top: 1px solid var(--wg-line);
  border-bottom: 1px solid var(--wg-line);
  padding: 8px 0;
}
.logo-cell {
  padding: 28px 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 110px;
  border-right: 1px solid var(--wg-line);
  transition: background 240ms ease;
  cursor: pointer;
}
.logo-cell:hover { background: var(--wg-cream); }
.logo-cell:nth-child(6n) { border-right: none; }
.logo-cell:nth-child(-n+6) { border-bottom: 1px solid var(--wg-line); }
.logo-cell img {
  max-width: 100%;
  max-height: 56px;
  width: auto;
  height: auto;
  object-fit: contain;
  filter: grayscale(1) contrast(0.95) brightness(0.95);
  opacity: 0.72;
  transition: filter 320ms var(--ease-out), opacity 320ms var(--ease-out);
}
.logo-cell:hover img { filter: grayscale(0) contrast(1) brightness(1); opacity: 1; }

/* =========================================================
   CTA / Contact
   ========================================================= */
.cta { display: grid; grid-template-columns: 1.2fr 1fr; gap: 80px; align-items: center; }
.cta__copy h2 {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: clamp(40px, 5.4vw, 72px);
  line-height: 1.02;
  letter-spacing: -0.025em;
  margin: 18px 0 24px;
  text-wrap: balance;
}
.cta__copy h2 em { font-style: italic; font-weight: 500; color: var(--wg-gold-300); }
.cta__copy p { font-size: 18px; line-height: 1.6; color: rgba(250,248,244,0.72); margin: 0; max-width: 520px; }
.cta__card {
  background: var(--wg-paper);
  color: var(--wg-ink-900);
  border-radius: var(--r-xl);
  padding: 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  box-shadow: var(--sh-3);
  border: 1px solid var(--wg-line);
}
.cta__card-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--wg-line);
}
.cta__card-row:last-of-type { border-bottom: none; }
.cta__card-icon {
  width: 40px; height: 40px;
  background: var(--gold-soft);
  color: var(--gold-accent);
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 600;
  font-size: 16px;
  flex-shrink: 0;
}
.cta__card-label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); font-weight: 500; margin-bottom: 2px; }
.cta__card-value { font-size: 16px; font-weight: 500; color: var(--wg-ink-900); }
.cta__card-value:hover { color: var(--gold-accent); }
.cta__primary {
  margin-top: 8px;
  font-size: 15px;
  padding: 16px 24px;
  border-radius: 12px;
  width: 100%;
  background: var(--wg-navy-800);
  color: var(--wg-paper);
  border: none;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 240ms var(--ease-out);
}
.cta__primary:hover { background: var(--wg-navy-700); transform: translateY(-1px); box-shadow: var(--sh-3); }

/* =========================================================
   Locatie
   ========================================================= */
.locatie { display: grid; grid-template-columns: 1fr 1.15fr; gap: 72px; align-items: stretch; }
.locatie__copy { display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.locatie__body { font-size: 17px; line-height: 1.7; color: var(--fg-2); margin: 0; max-width: 460px; }
.locatie__address {
  font-style: normal;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 20px 0;
  border-top: 1px solid var(--wg-line);
  border-bottom: 1px solid var(--wg-line);
  font-family: var(--font-serif);
  font-size: 19px;

/* ---- Reveal on scroll ---- */
function Reveal({ children, delay = 0, className = "", style = {} }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => { entries.forEach((e) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } }); },
      { threshold: 0.10, rootMargin: "0px 0px -6% 0px" }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <div
      ref={ref}
      className={`reveal ${shown ? "is-in" : ""} ${className}`}
      style={{ transitionDelay: `${delay}ms`, ...style }}>
      {children}
    </div>
  );
}

      { rootMargin: '-25% 0px -65% 0px', threshold: 0 }

    els.forEach((el) => io.observe(el));
    return () => io.disconnect();

      </div>
    </>

}

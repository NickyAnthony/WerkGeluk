<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 411" width="540" height="411" role="img" aria-label="WerkGeluk Recruitment">
  <defs>
    <!-- Merkgradiënt: 135°, brons → helder goud → brons -->
    <linearGradient id="wgGold" gradientUnits="userSpaceOnUse" x1="195" y1="16" x2="352" y2="180">
      <stop offset="0%"   stop-color="#A87C33"/>
      <stop offset="30%"  stop-color="#C9A25B"/>
      <stop offset="55%"  stop-color="#F2DCA2"/>
      <stop offset="80%"  stop-color="#C9A25B"/>
      <stop offset="100%" stop-color="#9A7530"/>
    </linearGradient>
    <linearGradient id="wgLight" gradientUnits="userSpaceOnUse" x1="330" y1="30" x2="200" y2="180">
      <stop offset="0%"   stop-color="#FDFDFE"/>
      <stop offset="100%" stop-color="#E9EAEE"/>
    </linearGradient>
  </defs>

  <!-- Icoon: lichte helft als volledige cirkel, gouden helft eroverheen -->
  <circle cx="270" cy="98" r="87" fill="url(#wgLight)"/>
  <path d="M270 11
           A87 87 0 0 1 270 185
           A43.5 43.5 0 0 0 270 98
           A43.5 43.5 0 0 1 270 11 Z"
        fill="url(#wgGold)"/>

  <!-- Woordmerk -->
  <text x="270" y="333"
        font-family="Arimo, Arial, Helvetica, sans-serif"
        font-size="100" font-weight="600"
        textLength="524" lengthAdjust="spacing"
        fill="#F1F1F3" text-anchor="middle">WerkGeluk</text>

  <text x="270" y="376"
        font-family="Arimo, Arial, Helvetica, sans-serif"
        font-size="16" font-weight="400"
        textLength="292" lengthAdjust="spacing"
        fill="#DCDCE0" fill-opacity="0.72" text-anchor="middle">RECRUITMENT</text>
</svg>
